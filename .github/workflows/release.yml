name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testOasisBrowserDebugUnitTest

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Assemble release APK
        env:
          KEYSTORE: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ALIAS: oasis
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleOasisBrowserRelease

      - name: Assemble debug APK
        run: ./gradlew assembleOasisBrowserDebug

      - name: Rename APKs
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/oasisBrowser/release/*.apk "release-assets/OasisBrowser-${GITHUB_REF_NAME}-release.apk"
          cp app/build/outputs/apk/oasisBrowser/debug/*.apk "release-assets/OasisBrowser-${GITHUB_REF_NAME}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.apk
