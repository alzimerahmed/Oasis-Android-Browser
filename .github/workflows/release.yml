name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testOasisBrowserDebugUnitTest

      - name: Restore signing keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: release.keystore
          key: oasis-release-keystore-v1

      - name: Generate signing keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storetype PKCS12 \
            -alias oasisbrowser \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass oasisbrowser -keypass oasisbrowser \
            -dname "CN=Oasis Browser, OU=Oasis, O=Oasis Browser, L=Internet, ST=Internet, C=US"

      - name: Assemble release APK
        env:
          KEYSTORE: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: oasisbrowser
          ALIAS: oasisbrowser
          KEY_PASSWORD: oasisbrowser
        run: ./gradlew assembleOasisBrowserRelease

      - name: Assemble debug APK
        run: ./gradlew assembleOasisBrowserDebug

      - name: Rename APKs
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/oasisBrowser/release/*.apk "release-assets/OasisBrowser-${GITHUB_REF_NAME}-release.apk"
          cp app/build/outputs/apk/oasisBrowser/debug/*.apk "release-assets/OasisBrowser-${GITHUB_REF_NAME}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.apk
